<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Details - LearnHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <h1 class="logo">📚 LearnHub</h1>
            <nav class="nav">
                <a href="index.html" class="nav-link">Home</a>
                <a href="#" class="nav-link" id="progress-link">My Progress</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- Back Button -->
            <div class="back-section">
                <a href="index.html" class="back-button">← Back to Courses</a>
            </div>

            <!-- Course Details -->
            <section class="course-details" id="course-details">
                <!-- Course content will be dynamically loaded here -->
                <div class="loading">Loading course details...</div>
            </section>

            <!-- Course Completion Status -->
            <section class="completion-section" id="completion-section" style="display: none;">
                <div class="completion-card">
                    <div class="completion-icon">✅</div>
                    <h3>Course Completed!</h3>
                    <p>Congratulations! You've successfully completed this course.</p>
                    <button class="btn btn-secondary" onclick="markAsIncomplete()">Mark as Incomplete</button>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 LearnHub. Built with ❤️ for learners everywhere.</p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="course.js"></script>
</body>
</html>
